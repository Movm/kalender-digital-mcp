name: Fehler melden
description: Reproduzierbares Problem im Server oder in der MCP-Anbindung
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Erwartetes und tatsächliches Verhalten; alle Secrets entfernen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduktion
      description: Minimale Schritte mit einem Testkalender.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version und Umgebung
